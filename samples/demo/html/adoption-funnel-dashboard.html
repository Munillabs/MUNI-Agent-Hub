<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>교육·확산 퍼널 대시보드</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1d2733;--sub:#5d6b7b;--line:#e2e7ee;--pri:#003F6D;--onpri:#fff;--soft:#e8f2fb;--ok:#1a8f63;--warn:#d98a06;--bad:#cf3f3f;--f1:#003F6D;--f2:#0a5a96;--f3:#0a6cbd;--f4:#4f9ad8}
@media (prefers-color-scheme:dark){:root{--bg:#0c141e;--card:#142131;--ink:#e5edf6;--sub:#9cafc3;--line:#25374c;--pri:#80CAFF;--onpri:#06233b;--soft:#1a2d44;--ok:#45c492;--warn:#f0a83a;--bad:#ff7a7a;--f1:#BFE3FF;--f2:#9fd3ff;--f3:#80CAFF;--f4:#4f9ad8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Pretendard,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
.lead{color:var(--sub);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 small{font-weight:500;color:var(--sub);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.funnel{display:flex;flex-direction:column;align-items:center;gap:6px}
.fs{position:relative;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#fff;border-radius:10px;transition:width .8s cubic-bezier(.2,.8,.2,1);min-width:230px;font-weight:700}
@media (prefers-color-scheme:dark){.fs{color:#06233b}}
.fs small{font-weight:500;opacity:.85;font-size:12px;display:block}
.fs .n{font-size:22px;font-variant-numeric:tabular-nums}
.conv{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.conv b{color:var(--ink)}
.conv.neck b{color:var(--bad)}
.neckTag{background:rgba(207,63,63,.14);color:var(--bad);border-radius:999px;padding:1px 8px;font-weight:700}
.sel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sel button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;font-family:inherit;cursor:pointer}
.sel button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:center}
th:first-child,td:first-child{text-align:left}
th{color:var(--sub);font-weight:600;font-size:12px}
td.h{font-weight:700;border-radius:6px;font-variant-numeric:tabular-nums}
.trend svg text{fill:var(--sub);font-size:11px;font-family:inherit}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:6px}
.legend i{display:inline-block;width:10px;height:3px;margin-right:5px;vertical-align:3px}
.acts{list-style:none;margin:0;padding:0}
.acts li{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.acts li:first-child{border-top:0}
.acts b{color:var(--bad)}
textarea{width:100%;min-height:170px;border:1px solid var(--line);border-radius:10px;padding:12px;font:12px/1.5 Consolas,monospace;background:var(--bg);color:var(--ink)}
button.pri{border:0;border-radius:999px;padding:9px 18px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;background:var(--pri);color:var(--onpri)}
button.ghost{background:var(--soft);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hint{font-size:12px;color:var(--sub)}
details summary{cursor:pointer;font-weight:700}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>교육 · 확산 퍼널 대시보드</h1>
  <p class="lead">라이선스를 받은 사람이 교육 → 첫 사용 → 매주 사용까지 얼마나 이어지는지 부서별로 보여 주고, 가장 많이 빠지는 단계(병목)와 맞는 처방을 알려 줘요.</p>
  <div class="grid2">
    <div class="card"><h2>확산 퍼널 <small id="fsub"></small></h2><div class="sel" id="sel"></div><div class="funnel" id="funnel"></div></div>
    <div class="card"><h2>병목별 처방</h2><ul class="acts" id="acts"></ul></div>
  </div>
  <div class="card"><h2>부서별 단계 전환율 <small>앞 단계 대비 다음 단계로 넘어간 비율 · 빨간 칸 = 그 부서의 병목</small></h2><table id="tbl"></table></div>
  <div class="card trend"><h2>주간 활성 사용률 추이</h2><svg id="trend" viewBox="0 0 900 260" width="100%"></svg><div class="legend" id="tleg"></div></div>
  <div class="card"><details><summary>데이터 바꾸기</summary>
    <p class="hint">부서별 퍼널: 부서, 라이선스, 교육 이수, 첫 사용, 주간 활성 · 그 아래 빈 줄 하나 띄우고 주간 추이: 주차, 부서1 활성률(%), 부서2 …</p>
    <textarea id="src" spellcheck="false"></textarea>
    <div class="row"><button class="pri" id="run">다시 그리기</button><button class="pri ghost" id="sample">예시 데이터</button></div>
  </details></div>
</div>
<script>
const SAMPLE = `부서,라이선스,교육 이수,첫 사용,주간 활성
영업본부,120,112,104,86
마케팅팀,45,44,42,38
재무팀,30,26,14,9
인사팀,25,14,12,10
연구개발,80,71,66,38
고객지원,60,58,52,47

주차,영업본부,마케팅팀,재무팀,인사팀,연구개발,고객지원
1주,22,30,8,10,18,25
2주,38,51,12,16,26,41
3주,49,64,17,22,33,55
4주,58,72,22,28,38,63
5주,64,79,25,33,42,70
6주,68,82,27,36,45,76
7주,70,84,29,38,47,77
8주,72,84,30,40,48,78`;
const STAGES = ['라이선스', '교육 이수', '첫 사용', '주간 활성'];
const RX = [
  ['교육 이수', '교육 전 단계에서 빠져요', '팀장을 통해 교육 일정을 다시 안내하고, 30분 온라인 · 녹화 교육으로 바꿔 참석 부담을 줄이세요. 이수하지 않은 사람 목록을 챔피언에게 전달하세요.'],
  ['첫 사용', '교육은 들었지만 써 보지 않아요', '교육 직후 "첫 과제"(내 메일 요약해 보기 등)를 주고, 부서 업무에 맞는 복사용 프롬프트 3개를 배포하세요. 쓸 일이 떠오르지 않는 게 가장 흔한 원인이에요.'],
  ['주간 활성', '한두 번 쓰고 멈춰요', '"매일 한 번 쓰기" 2주 미션과 팀 회의 팁 공유를 시작하세요. 부서 업무에 맞는 시나리오가 없다면 시나리오 워크숍을 다시 여세요.']
];
const COLORS = ['#0a6cbd', '#1a8f63', '#cf3f3f', '#d98a06', '#7b5cd6', '#0e9aa7', '#8a6d3b', '#e0559a'];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let depts = [], weeks = null, pick = '전체';

function parse(t) {
  const [a, b] = t.trim().split(/\r?\n\s*\r?\n/);
  const rows = a.trim().split(/\r?\n/).slice(1).map(l => l.split(/[,\t]/).map(s => s.trim())).filter(c => c[0]);
  depts = rows.map(c => ({ n: c[0], v: c.slice(1, 5).map(Number) }));
  if (b) { const L = b.trim().split(/\r?\n/).map(l => l.split(/[,\t]/).map(s => s.trim())); weeks = { names: L[0].slice(1), rows: L.slice(1).map(c => ({ w: c[0], v: c.slice(1).map(Number) })) }; } else { weeks = null; }
}
const neckOf = v => { let w = 1, low = 2; for (let i = 1; i < 4; i++) { const r = v[i] / (v[i - 1] || 1); if (r < low) { low = r; w = i; } } return w; };

function funnel() {
  const v = pick === '전체' ? [0, 1, 2, 3].map(i => depts.reduce((s, d) => s + d.v[i], 0)) : depts.find(d => d.n === pick).v;
  const neck = neckOf(v);
  $('fsub').textContent = `${pick} · 최종 활성 ${Math.round(v[3] / v[0] * 100)}%`;
  const cols = ['var(--f1)', 'var(--f2)', 'var(--f3)', 'var(--f4)'];
  $('funnel').innerHTML = v.map((n, i) => (i ? `<div class="conv ${i === neck ? 'neck' : ''}">↓ <b>${Math.round(n / v[i - 1] * 100)}%</b> 넘어감 · ${v[i - 1] - n}명 빠짐 ${i === neck ? '<span class="neckTag">병목</span>' : ''}</div>` : '') +
    `<div class="fs" style="width:30%;background:${cols[i]}" data-w="${Math.max(36, n / v[0] * 100)}"><span>${STAGES[i]}<small>${Math.round(n / v[0] * 100)}%</small></span><span class="n">${n.toLocaleString('ko-KR')}명</span></div>`).join('');
  requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('.fs').forEach(f => { f.style.width = f.dataset.w + '%'; })));
  const byNeck = [1, 2, 3].map(i => depts.filter(d => neckOf(d.v) === i).map(d => d.n));
  $('acts').innerHTML = RX.map((r, i) => `<li><div><b>${r[0]}</b><div class="hint">${r[1]}</div></div><div>${byNeck[i].length ? `<div class="hint" style="margin-bottom:4px">해당 부서: <b>${byNeck[i].map(esc).join(', ')}</b></div>` : '<div class="hint" style="margin-bottom:4px">해당 부서 없음</div>'}${r[2]}</div></li>`).join('');
}

function table() {
  const heat = r => r >= 0.9 ? 'rgba(26,143,99,.18)' : r >= 0.75 ? 'rgba(10,108,189,.14)' : r >= 0.6 ? 'rgba(217,138,6,.2)' : 'rgba(207,63,63,.22)';
  $('tbl').innerHTML = '<tr><th>부서</th><th>라이선스</th><th>→ 교육 이수</th><th>→ 첫 사용</th><th>→ 주간 활성</th><th>최종 활성률</th></tr>' +
    depts.map(d => { const nk = neckOf(d.v); return `<tr><td>${esc(d.n)}</td><td>${d.v[0]}</td>` + [1, 2, 3].map(i => { const r = d.v[i] / (d.v[i - 1] || 1); return `<td class="h" style="background:${heat(r)};${i === nk ? 'outline:2px solid var(--bad);outline-offset:-2px' : ''}">${Math.round(r * 100)}%</td>`; }).join('') + `<td class="h">${Math.round(d.v[3] / d.v[0] * 100)}%</td></tr>`; }).join('');
}

function trend() {
  if (!weeks) { $('trend').innerHTML = ''; return; }
  const W = 900, H = 260, l = 40, r = 120, t = 12, b = 28, n = weeks.rows.length;
  const x = i => l + (W - l - r) * i / Math.max(1, n - 1), y = v => H - b - (H - b - t) * v / 100;
  let s = '';
  [0, 25, 50, 75, 100].forEach(v => { s += `<line x1="${l}" x2="${W - r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${l - 6}" y="${y(v) + 4}" text-anchor="end">${v}%</text>`; });
  weeks.rows.forEach((rw, i) => { s += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(rw.w)}</text>`; });
  weeks.names.forEach((nm, k) => {
    const c = COLORS[k % COLORS.length], dim = pick !== '전체' && pick !== nm;
    const pts = weeks.rows.map((rw, i) => `${x(i)},${y(rw.v[k])}`).join(' ');
    const last = weeks.rows[n - 1].v[k];
    s += `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="${dim ? 1.5 : 3}" opacity="${dim ? .25 : 1}" stroke-linejoin="round"/>`;
    s += `<text x="${x(n - 1) + 8}" y="${y(last) + 4}" style="fill:${c};font-weight:700;opacity:${dim ? .35 : 1}">${esc(nm)} ${last}%</text>`;
  });
  $('trend').innerHTML = s;
  $('tleg').innerHTML = '<span class="hint">위 부서 버튼을 누르면 그 부서만 강조돼요.</span>';
}

function draw() {
  $('sel').innerHTML = ['전체', ...depts.map(d => d.n)].map(n => `<button class="${n === pick ? 'on' : ''}">${esc(n)}</button>`).join('');
  $('sel').querySelectorAll('button').forEach(b => b.onclick = () => { pick = b.textContent; draw(); });
  funnel(); table(); trend();
}
function run() { parse($('src').value); if (!depts.some(d => d.n === pick)) { pick = '전체'; } draw(); }
$('src').value = SAMPLE;
$('run').onclick = run;
$('sample').onclick = () => { $('src').value = SAMPLE; run(); };
run();
</script>
</body>
</html>
