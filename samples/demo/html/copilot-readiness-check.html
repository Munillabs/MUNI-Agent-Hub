<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copilot 도입 준비도 진단</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1d2733;--sub:#5d6b7b;--line:#e2e7ee;--pri:#003F6D;--onpri:#fff;--soft:#e8f2fb;--ok:#1a8f63;--warn:#c77a06;--bad:#cf3f3f;--area:rgba(10,108,189,.22);--stroke:#0a6cbd}
@media (prefers-color-scheme:dark){:root{--bg:#0c141e;--card:#142131;--ink:#e5edf6;--sub:#9cafc3;--line:#25374c;--pri:#80CAFF;--onpri:#06233b;--soft:#1a2d44;--ok:#45c492;--warn:#f0a83a;--bad:#ff7a7a;--area:rgba(128,202,255,.25);--stroke:#80CAFF}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Pretendard,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
.lead{color:var(--sub);margin:0 0 22px}
.layout{display:grid;grid-template-columns:1fr 400px;gap:16px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 4px;display:flex;justify-content:space-between;align-items:center}
.card h2 small{font-size:13px;color:var(--sub);font-weight:600}
.desc{color:var(--sub);font-size:13px;margin:0 0 12px}
.q{padding:10px 0;border-top:1px solid var(--line)}
.q p{margin:0 0 8px;font-size:14px}
.scale{display:flex;gap:6px}
.scale button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 0;font-weight:600;font-size:13px;font-family:inherit;cursor:pointer;transition:.15s}
.scale button:hover{border-color:var(--stroke)}
.scale button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.hint{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:4px}
.side{position:sticky;top:16px}
.score{text-align:center}
.score .big{font-size:48px;font-weight:800;letter-spacing:-.03em}
.score .lv{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:700;font-size:13px}
svg text{fill:var(--sub);font-size:11px;font-family:inherit}
.recs{margin:0;padding:0;list-style:none}
.recs li{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.recs b{display:block;margin-bottom:2px}
.progress{height:6px;background:var(--soft);border-radius:999px;overflow:hidden;margin:10px 0 2px}
.progress i{display:block;height:100%;background:var(--stroke);width:0;transition:width .3s}
.row{display:flex;gap:8px;margin-top:12px}
button.pri{border:0;border-radius:999px;padding:9px 18px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;background:var(--pri);color:var(--onpri)}
button.ghost{background:var(--soft);color:var(--ink)}
@media (max-width:900px){.layout{grid-template-columns:1fr}.side{position:static}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Copilot 도입 준비도 진단</h1>
  <p class="lead">6개 영역 18개 질문에 답하면 조직의 Microsoft 365 Copilot 도입 준비도를 레이더 차트로 보여 주고, 먼저 할 일을 추천해요. 고객 워크숍에서 함께 눌러 보세요.</p>
  <div class="layout">
    <div id="qs"></div>
    <div class="side">
      <div class="card score">
        <div class="desc">종합 준비도</div>
        <div class="big" id="total">–</div>
        <div class="lv" id="level"></div>
        <div class="progress"><i id="prog"></i></div>
        <div class="desc" id="answered"></div>
        <svg id="radar" viewBox="0 0 360 330" width="100%"></svg>
      </div>
      <div class="card"><h2>먼저 할 일</h2><ul class="recs" id="recs"><li>질문에 답하면 추천이 나와요.</li></ul>
        <div class="row"><button class="pri" id="copy">결과 복사</button><button class="pri ghost" id="demo">예시로 채우기</button><button class="pri ghost" id="reset">초기화</button></div>
      </div>
    </div>
  </div>
</div>
<script>
const AREAS = [
  { k: '전략·스폰서십', d: '경영진이 왜 도입하는지 분명히 말할 수 있나요?', q: ['경영진 스폰서가 정해져 있고 도입 목적을 공개적으로 말한다', '측정할 수 있는 도입 목표(예: 활성 사용률, 절감 시간)가 있다', '파일럿 대상 부서와 시나리오가 정해져 있다'],
    rec: '경영진 스폰서와 함께 도입 목적 1문장과 측정 목표 3개를 정하세요.' },
  { k: '데이터·보안', d: 'Copilot은 사용자가 접근할 수 있는 모든 자료를 참고해요.', q: ['SharePoint·Teams의 "모든 사람" 공유 현황을 점검했다', '민감도 레이블이 정의되어 있고 일부라도 적용 중이다', '소유자가 없거나 오래된 사이트를 정리하는 절차가 있다'],
    rec: '데이터 과다 공유(오버셰어링) 점검부터 하세요. 민감한 사이트의 "모든 사람" 권한 제거가 1순위예요.' },
  { k: '기술 환경', d: 'M365 앱과 라이선스가 준비되어 있나요?', q: ['대상자가 최신 Microsoft 365 앱(Teams, Outlook, Office)을 쓴다', '자료가 개인 PC가 아닌 OneDrive·SharePoint에 저장되어 있다', 'Copilot 라이선스 배정·회수 절차가 정해져 있다'],
    rec: '파일을 OneDrive·SharePoint로 옮기는 캠페인을 먼저 하세요. 클라우드에 없는 자료는 Copilot이 못 봐요.' },
  { k: '업무 시나리오', d: '어떤 일에 쓸지 구체적으로 정했나요?', q: ['부서별로 반복 업무와 소요 시간을 파악했다', 'Copilot을 쓸 우선 시나리오 3~5개를 골랐다', '시나리오별 예시 프롬프트가 준비되어 있다'],
    rec: '부서별 반복 업무 목록을 받아 효과·난이도로 시나리오 우선순위를 정하세요.' },
  { k: '사람·문화', d: '직원들이 새 도구를 받아들일 준비가 되어 있나요?', q: ['AI 도입에 대한 직원의 걱정(일자리, 감시)을 다룰 계획이 있다', '부서마다 챔피언(먼저 써 보고 알려 줄 사람)이 있다', '직무별 교육 계획과 질문할 채널이 있다'],
    rec: '챔피언을 부서마다 1명씩 정하고, 걱정에 답하는 FAQ와 직무별 교육을 준비하세요.' },
  { k: '측정·개선', d: '잘 되고 있는지 어떻게 알 수 있나요?', q: ['사용량 보고서를 정기적으로 확인할 담당자가 있다', '사용자 설문(만족도, 절감 시간)을 할 계획이 있다', '성공 사례를 모아 공유하는 방법이 있다'],
    rec: '월 1회 사용 현황 보고와 분기 설문 일정을 먼저 정하세요. 측정하지 않으면 확산 근거가 없어요.' }
];
const LABELS = ['전혀 아니다', '', '보통', '', '매우 그렇다'];
const ans = AREAS.map(a => a.q.map(() => 0));
const $ = id => document.getElementById(id);

$('qs').innerHTML = AREAS.map((a, i) => `<div class="card"><h2>${i + 1}. ${a.k}<small id="as${i}">–</small></h2><p class="desc">${a.d}</p>` +
  a.q.map((q, j) => `<div class="q"><p>${q}</p><div class="scale" data-a="${i}" data-q="${j}">${[1, 2, 3, 4, 5].map(v => `<button data-v="${v}">${v}</button>`).join('')}</div><div class="hint"><span>전혀 아니다</span><span>매우 그렇다</span></div></div>`).join('') + '</div>').join('');

document.querySelectorAll('.scale').forEach(s => s.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) { return; }
  ans[s.dataset.a][s.dataset.q] = Number(b.dataset.v); update();
}));

function areaScore(i) { const v = ans[i].filter(Boolean); return v.length ? v.reduce((x, y) => x + y, 0) / v.length : 0; }

function radar(scores) {
  const cx = 180, cy = 165, R = 120, n = scores.length;
  const pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  let s = '';
  for (let lv = 1; lv <= 5; lv++) { s += `<polygon points="${scores.map((_, i) => pt(i, R * lv / 5).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`; }
  scores.forEach((_, i) => { const [x, y] = pt(i, R); s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`; });
  s += `<polygon points="${scores.map((v, i) => pt(i, R * v / 5).join(',')).join(' ')}" fill="var(--area)" stroke="var(--stroke)" stroke-width="2" style="transition:all .4s"/>`;
  scores.forEach((v, i) => { const [x, y] = pt(i, R * v / 5); if (v) { s += `<circle cx="${x}" cy="${y}" r="4" fill="var(--stroke)"/>`; } });
  AREAS.forEach((a, i) => { const [x, y] = pt(i, R + 22); s += `<text x="${x}" y="${y + 4}" text-anchor="middle">${a.k}${scores[i] ? ' ' + scores[i].toFixed(1) : ''}</text>`; });
  $('radar').innerHTML = s;
}

function update() {
  document.querySelectorAll('.scale').forEach(s => s.querySelectorAll('button').forEach(b => b.classList.toggle('on', ans[s.dataset.a][s.dataset.q] === Number(b.dataset.v))));
  const scores = AREAS.map((_, i) => areaScore(i));
  scores.forEach((v, i) => { $('as' + i).textContent = v ? v.toFixed(1) + ' / 5' : '–'; });
  const done = ans.flat().filter(Boolean).length, all = ans.flat().length;
  $('prog').style.width = done / all * 100 + '%';
  $('answered').textContent = `${done} / ${all} 문항 답함`;
  radar(scores);
  const valid = scores.filter(Boolean);
  if (!valid.length) { $('total').textContent = '–'; $('level').textContent = ''; return; }
  const t = Math.round(valid.reduce((a, b) => a + b, 0) / valid.length * 20);
  $('total').textContent = t + '점';
  const lv = t >= 80 ? ['확산 준비 완료', 'var(--ok)'] : t >= 60 ? ['파일럿 가능', 'var(--stroke)'] : t >= 40 ? ['기반 정비 필요', 'var(--warn)'] : ['준비 단계', 'var(--bad)'];
  $('level').textContent = lv[0]; $('level').style.color = lv[1]; $('level').style.background = 'var(--soft)';
  const weak = scores.map((v, i) => ({ v, i })).filter(x => x.v).sort((a, b) => a.v - b.v).slice(0, 3);
  $('recs').innerHTML = weak.map((x, n) => `<li><b>${n + 1}. ${AREAS[x.i].k} (${x.v.toFixed(1)})</b>${AREAS[x.i].rec}</li>`).join('');
}

$('copy').onclick = () => {
  const scores = AREAS.map((_, i) => areaScore(i));
  const txt = `[Copilot 도입 준비도 진단] 종합 ${$('total').textContent} · ${$('level').textContent}\n` + AREAS.map((a, i) => `- ${a.k}: ${scores[i] ? scores[i].toFixed(1) : '미응답'}`).join('\n') +
    '\n\n먼저 할 일\n' + [...document.querySelectorAll('#recs li')].map(l => '- ' + l.innerText.replace('\n', ': ')).join('\n');
  navigator.clipboard.writeText(txt);
  $('copy').textContent = '복사했어요'; setTimeout(() => { $('copy').textContent = '결과 복사'; }, 1500);
};
$('demo').onclick = () => { const d = [[5, 4, 4], [2, 2, 1], [4, 3, 3], [3, 2, 2], [3, 1, 2], [2, 2, 1]]; d.forEach((r, i) => r.forEach((v, j) => { ans[i][j] = v; })); update(); };
$('reset').onclick = () => { ans.forEach(r => r.fill(0)); update(); };
update();
</script>
</body>
</html>
