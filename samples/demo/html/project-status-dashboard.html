<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>프로젝트 현황 대시보드</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1d2733;--sub:#5d6b7b;--line:#e2e7ee;--pri:#003F6D;--onpri:#fff;--soft:#e8f2fb;--g:#1a8f63;--a:#d98a06;--r:#cf3f3f;--bar:#0a6cbd;--bar2:#b9d7f0}
@media (prefers-color-scheme:dark){:root{--bg:#0c141e;--card:#142131;--ink:#e5edf6;--sub:#9cafc3;--line:#25374c;--pri:#80CAFF;--onpri:#06233b;--soft:#1a2d44;--g:#45c492;--a:#f0a83a;--r:#ff7a7a;--bar:#80CAFF;--bar2:#2b4866}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Pretendard,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:26px;margin:0;letter-spacing:-.02em}
.lead{color:var(--sub);margin:4px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center}
.card h2 small{font-weight:500;color:var(--sub);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.kpi .l{color:var(--sub);font-size:13px}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.kpi .d{font-size:13px;color:var(--sub)}
.rag{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:24px}
.dot{width:16px;height:16px;border-radius:50%;display:inline-block}
.G{background:var(--g)}.A{background:var(--a)}.R{background:var(--r)}
.grid2{display:grid;grid-template-columns:3fr 2fr;gap:16px}
.gantt{position:relative}
.gr{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;margin:10px 0;font-size:14px}
.gt{position:relative;height:26px;background:var(--soft);border-radius:6px}
.gb{position:absolute;top:0;bottom:0;border-radius:6px;background:var(--bar2);overflow:hidden}
.gb i{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:6px;width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.gb.late i{background:var(--a)}
.today{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--r);z-index:2}
.today span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--r);white-space:nowrap;font-weight:700}
.months{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;font-size:11px;color:var(--sub)}
.months div{position:relative;height:16px}
.months span{position:absolute;transform:translateX(-50%)}
.pct{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.heat{display:grid;grid-template-columns:28px repeat(3,1fr);grid-template-rows:repeat(3,72px) 24px;gap:6px}
.cell{border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;position:relative}
.cell b{font-size:11px;background:var(--card);border-radius:999px;padding:2px 8px;cursor:default;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.ax{font-size:11px;color:var(--sub);display:grid;place-items:center}
.ax.v{writing-mode:vertical-rl;transform:rotate(180deg)}
.ms{list-style:none;margin:0;padding:0}
.ms li{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.ms li:first-child{border-top:0}
.ms .st{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}
.done{color:var(--g)}.over{color:var(--r)}.soon{color:var(--a)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:600;font-size:13px}
.lv{font-weight:800}
.summary{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:16px;font-size:14px;margin:0}
textarea{width:100%;min-height:260px;border:1px solid var(--line);border-radius:10px;padding:12px;font:13px/1.6 Consolas,monospace;background:var(--bg);color:var(--ink)}
button{border:0;border-radius:999px;padding:9px 18px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;background:var(--pri);color:var(--onpri)}
button.ghost{background:var(--soft);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hint{font-size:12px;color:var(--sub)}
details summary{cursor:pointer;font-weight:700}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.gr,.months{grid-template-columns:96px 1fr 40px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1 id="pname">프로젝트 현황 대시보드</h1><p class="lead" id="pmeta"></p></div>
    <div class="row" style="margin:0"><button id="copy">주간 보고 문장 복사</button><button class="ghost" onclick="window.print()">인쇄 · PDF</button></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="card"><h2>단계별 일정 <small>막대 = 계획 기간 · 진한 부분 = 진행률 · 빨간 선 = 기준일</small></h2><div class="months" id="months"></div><div class="gantt" id="gantt"></div></div>
  <div class="grid2">
    <div class="card"><h2>위험 히트맵 <small>가능성 × 영향</small></h2><div class="heat" id="heat"></div></div>
    <div class="card"><h2>마일스톤</h2><ul class="ms" id="ms"></ul></div>
  </div>
  <div class="card"><h2>위험 · 이슈 목록</h2><table id="risks"></table></div>
  <div class="card"><h2>이번 주 보고 문장</h2><p class="summary" id="sum"></p></div>
  <div class="card">
    <details><summary>데이터 편집 (우리 프로젝트로 바꾸기)</summary>
      <p class="hint">한 줄에 하나씩, 칸은 | 로 나눠요. 고치면 바로 대시보드에 반영돼요. 이 브라우저에 저장돼요.</p>
      <textarea id="src" spellcheck="false"></textarea>
      <div class="row"><button class="ghost" id="reset">예시로 되돌리기</button></div>
    </details>
  </div>
</div>
<script>
const SAMPLE = `프로젝트: 고객사 A · Microsoft 365 Copilot 도입 컨설팅
기간: 2026-10-05 | 2027-01-29
기준일: 2026-11-20
단계: 준비 · 데이터 거버넌스 점검 | 2026-10-05 | 2026-10-30 | 100
단계: 시나리오 발굴 · 워크숍 | 2026-10-19 | 2026-11-13 | 100
단계: 파일럿 (200명) | 2026-11-02 | 2026-12-11 | 55
단계: 교육 · 챔피언 운영 | 2026-11-09 | 2027-01-15 | 30
단계: 전사 확산 준비 | 2026-12-07 | 2027-01-22 | 0
단계: 효과 측정 · 최종 보고 | 2027-01-11 | 2027-01-29 | 0
마일스톤: 킥오프 | 2026-10-06 | Y
마일스톤: 오버셰어링 점검 결과 보고 | 2026-10-30 | Y
마일스톤: 파일럿 시작 | 2026-11-02 | Y
마일스톤: 챔피언 1차 모임 | 2026-11-18 | N
마일스톤: 파일럿 중간 보고 | 2026-11-27 | N
마일스톤: 전사 확산 의사결정 | 2026-12-18 | N
마일스톤: 최종 보고 | 2027-01-29 | N
위험: 민감도 레이블 정책 승인 지연 | 3 | 3 | 고객 보안팀 | 12/4 보안위원회 안건 상정
위험: 재무팀 파일럿 참여율 저조 | 2 | 3 | 컨설팅 PM | 재무 맞춤 교육 · 챔피언 지정
위험: 라이선스 추가 구매 일정 미정 | 2 | 2 | 고객 IT | 12월 예산 회의에서 확정
위험: 교육장 일정 충돌 | 1 | 2 | 고객 HR | 온라인 교육으로 대체 가능
위험: 경영진 스폰서 메시지 지연 | 1 | 3 | 고객 스폰서 | 초안 전달 완료, 11/25 발송 예정`;
const KEY = 'pmo-dash-v1';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const D = s => new Date(s + 'T00:00:00');
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const md = d => `${d.getMonth() + 1}/${d.getDate()}`;
const days = (a, b) => Math.round((b - a) / 86400000);

function parse(t) {
  const p = { name: '', start: null, end: null, today: new Date(), phases: [], ms: [], risks: [] };
  t.split(/\r?\n/).forEach(l => {
    const m = /^\s*([^:]+):\s*(.*)$/.exec(l); if (!m) { return; }
    const k = m[1].trim(), v = m[2].split('|').map(s => s.trim());
    if (k === '프로젝트') { p.name = v.join(' | '); }
    else if (k === '기간') { p.start = D(v[0]); p.end = D(v[1]); }
    else if (k === '기준일') { p.today = D(v[0]); }
    else if (k === '단계') { p.phases.push({ n: v[0], s: D(v[1]), e: D(v[2]), p: Number(v[3]) || 0 }); }
    else if (k === '마일스톤') { p.ms.push({ n: v[0], d: D(v[1]), done: /^y/i.test(v[2] || '') }); }
    else if (k === '위험') { p.risks.push({ n: v[0], pr: Math.min(3, Math.max(1, Number(v[1]) || 1)), im: Math.min(3, Math.max(1, Number(v[2]) || 1)), o: v[3] || '', a: v[4] || '' }); }
  });
  if (!p.start && p.phases.length) { p.start = new Date(Math.min(...p.phases.map(x => x.s))); p.end = new Date(Math.max(...p.phases.map(x => x.e))); }
  return p;
}

function render() {
  const p = parse($('src').value);
  if (!p.start || !p.phases.length) { return; }
  try { localStorage.setItem(KEY, $('src').value); } catch (e) { /* 저장 못 해도 계속 */ }
  const span = days(p.start, p.end) || 1;
  const pos = d => Math.min(100, Math.max(0, days(p.start, d) / span * 100));
  // 단계별 기대 진행률 = 기준일까지 지난 기간 비율
  const exp = ph => Math.min(100, Math.max(0, days(ph.s, p.today) / Math.max(1, days(ph.s, ph.e)) * 100));
  const totalW = p.phases.reduce((s, x) => s + days(x.s, x.e), 0) || 1;
  const prog = p.phases.reduce((s, x) => s + x.p * days(x.s, x.e), 0) / totalW;
  const plan = p.phases.reduce((s, x) => s + exp(x) * days(x.s, x.e), 0) / totalW;
  const gap = prog - plan;
  const lev = r => r.pr * r.im;
  const high = p.risks.filter(r => lev(r) >= 6).length;
  const overMs = p.ms.filter(m => !m.done && m.d < p.today);
  const rag = high >= 2 || gap < -15 || overMs.length >= 2 ? 'R' : high >= 1 || gap < -5 || overMs.length ? 'A' : 'G';
  const ragTxt = { G: '정상', A: '주의', R: '위험' }[rag];
  $('pname').textContent = p.name || '프로젝트 현황 대시보드';
  $('pmeta').textContent = `기간 ${ymd(p.start)} ~ ${ymd(p.end)} · 기준일 ${md(p.today)} · 남은 기간 ${Math.max(0, days(p.today, p.end))}일`;
  $('kpis').innerHTML = [
    ['종합 상태', `<span class="rag"><span class="dot ${rag}"></span>${ragTxt}</span>`, `높은 위험 ${high}건 · 지난 마일스톤 미완료 ${overMs.length}건`],
    ['전체 진행률', Math.round(prog) + '%', `계획 ${Math.round(plan)}% 대비 <b class="${gap >= -5 ? 'done' : gap >= -15 ? 'soon' : 'over'}">${gap >= 0 ? '+' : ''}${Math.round(gap)}%p</b>`],
    ['마일스톤', `${p.ms.filter(m => m.done).length} / ${p.ms.length}`, (() => { const n = p.ms.filter(m => !m.done).sort((a, b) => a.d - b.d)[0]; return n ? `다음: ${esc(n.n)} (${md(n.d)})` : '모두 완료'; })()],
    ['열린 위험 · 이슈', p.risks.length + '건', `높음 ${high} · 중간 ${p.risks.filter(r => lev(r) >= 3 && lev(r) < 6).length} · 낮음 ${p.risks.filter(r => lev(r) < 3).length}`]
  ].map(k => `<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div><div class="d">${k[2]}</div></div>`).join('');

  const ticks = []; const c = new Date(p.start.getFullYear(), p.start.getMonth() + 1, 1);
  while (c <= p.end) { ticks.push(new Date(c)); c.setMonth(c.getMonth() + 1); }
  $('months').innerHTML = `<div></div><div>${ticks.map(t => `<span style="left:${pos(t)}%">${t.getMonth() + 1}월</span>`).join('')}</div><div></div>`;
  $('gantt').innerHTML = p.phases.map(ph => {
    const late = ph.p + 10 < exp(ph);
    return `<div class="gr"><span>${esc(ph.n)}</span><div class="gt"><div class="gb ${late ? 'late' : ''}" style="left:${pos(ph.s)}%;width:${pos(ph.e) - pos(ph.s)}%"><i data-w="${ph.p}"></i></div>
      <div class="today" style="left:${pos(p.today)}%">${ph === p.phases[0] ? `<span>기준일 ${md(p.today)}</span>` : ''}</div></div><span class="pct">${ph.p}%</span></div>`;
  }).join('');
  requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('.gb i').forEach(i => { i.style.width = i.dataset.w + '%'; })));

  const col = (pr, im) => { const v = pr * im; return v >= 6 ? 'rgba(207,63,63,.28)' : v >= 3 ? 'rgba(217,138,6,.25)' : 'rgba(26,143,99,.2)'; };
  let h = '';
  [3, 2, 1].forEach(pr => {
    h += `<div class="ax v">${['', '낮음', '중간', '높음'][pr]}</div>`;
    [1, 2, 3].forEach(im => { h += `<div class="cell" style="background:${col(pr, im)}">${p.risks.map((r, i) => r.pr === pr && r.im === im ? `<b title="${esc(r.n)}">R${i + 1}</b>` : '').join('')}</div>`; });
  });
  h += '<div></div>' + ['낮음', '중간', '높음'].map(x => `<div class="ax">영향 ${x}</div>`).join('');
  $('heat').innerHTML = h;

  $('ms').innerHTML = [...p.ms].sort((a, b) => a.d - b.d).map(m => {
    const st = m.done ? ['완료', 'done', '✔'] : m.d < p.today ? ['지연', 'over', '!'] : days(p.today, m.d) <= 7 ? ['이번 주', 'soon', '•'] : ['예정', '', '○'];
    return `<li><span class="${st[1]}">${st[2]}</span><span>${esc(m.n)} <span class="hint">${md(m.d)}</span></span><span class="st ${st[1]}" style="background:var(--soft)">${st[0]}</span></li>`;
  }).join('');

  $('risks').innerHTML = '<tr><th>ID</th><th>위험 · 이슈</th><th>수준</th><th>담당</th><th>대응</th></tr>' +
    p.risks.map((r, i) => ({ r, i })).sort((a, b) => lev(b.r) - lev(a.r)).map(({ r, i }) => { const l = lev(r); const t = l >= 6 ? ['높음', 'over'] : l >= 3 ? ['중간', 'soon'] : ['낮음', 'done']; return `<tr><td>R${i + 1}</td><td>${esc(r.n)}</td><td class="lv ${t[1]}">${t[0]}</td><td>${esc(r.o)}</td><td>${esc(r.a)}</td></tr>`; }).join('');

  const next = p.ms.filter(m => !m.done && m.d >= p.today).sort((a, b) => a.d - b.d).slice(0, 2);
  const top = [...p.risks].sort((a, b) => lev(b) - lev(a)).slice(0, 2);
  $('sum').textContent = [
    `■ 종합 상태: ${ragTxt} · 전체 진행률 ${Math.round(prog)}% (계획 대비 ${gap >= 0 ? '+' : ''}${Math.round(gap)}%p)`,
    `■ 진행 중: ${p.phases.filter(x => x.p > 0 && x.p < 100).map(x => `${x.n} ${x.p}%`).join(', ') || '없음'}`,
    overMs.length ? `■ 지연 마일스톤: ${overMs.map(m => `${m.n}(${md(m.d)})`).join(', ')}` : '■ 지연된 마일스톤은 없습니다.',
    next.length ? `■ 다음 마일스톤: ${next.map(m => `${m.n}(${md(m.d)})`).join(', ')}` : '',
    top.length ? `■ 주요 위험: ${top.map(r => `${r.n} → ${r.a}`).join(' / ')}` : '',
    high ? `■ 요청 사항: 높은 위험 ${high}건에 대한 고객 측 의사결정을 부탁드립니다.` : ''
  ].filter(Boolean).join('\n');
}

let saved = null; try { saved = localStorage.getItem(KEY); } catch (e) { saved = null; }
$('src').value = saved || SAMPLE;
$('src').oninput = render;
$('reset').onclick = () => { $('src').value = SAMPLE; render(); };
$('copy').onclick = () => { navigator.clipboard.writeText($('sum').textContent); $('copy').textContent = '복사했어요'; setTimeout(() => { $('copy').textContent = '주간 보고 문장 복사'; }, 1500); };
render();
</script>
</body>
</html>
